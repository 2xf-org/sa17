name: Release

# Push a tag such as v0.1.0 to publish that version to crates.io, PyPI and
# GitHub Releases. Both registries keep a version for ever, so a fix after a
# publish needs a new version. Run the workflow by hand to build and test
# everything without publishing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Each job reads the repository and nothing more, except where it says so.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIMETAL_VERSION: v202611.23.0

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - name: Compare Cargo.toml, pyproject.toml, and the tag
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          py_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -n 1)"
          if [ "$cargo_version" != "$py_version" ]; then
            echo "::error::Cargo.toml says $cargo_version, but python/pyproject.toml says $py_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_version" ]; then
            echo "::error::tag is $GITHUB_REF_NAME, but the manifests say $cargo_version"
            exit 1
          fi
      - name: Install Bimetal CLI
        run: |
          archive="bimetal-${BIMETAL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/2xf-org/bimetal/releases/download/${BIMETAL_VERSION}"
          mkdir -p "${RUNNER_TEMP}/bimetal"
          curl -fsSL "${base}/${archive}" -o "${RUNNER_TEMP}/bimetal/${archive}"
          curl -fsSL "${base}/SHA256SUMS" -o "${RUNNER_TEMP}/bimetal/SHA256SUMS"
          cd "${RUNNER_TEMP}/bimetal"
          grep "  ${archive}\$" SHA256SUMS | sha256sum -c -
          tar -xzf "${archive}"
          echo "${RUNNER_TEMP}/bimetal/bimetal-${BIMETAL_VERSION}-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"
      - name: Check generated bindings are in sync
        run: bimetal check --config rust/sa17-py
      - name: Verify crates.io package
        run: cargo package --locked -p sa17

  wheels:
    name: Wheel (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Bimetal CLI
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          archive="bimetal-${BIMETAL_VERSION}-${TARGET}.${EXT}"
          base="https://github.com/2xf-org/bimetal/releases/download/${BIMETAL_VERSION}"
          mkdir -p "${RUNNER_TEMP}/bimetal"
          curl -fsSL "${base}/${archive}" -o "${RUNNER_TEMP}/bimetal/${archive}"
          curl -fsSL "${base}/SHA256SUMS" -o "${RUNNER_TEMP}/bimetal/SHA256SUMS"
          cd "${RUNNER_TEMP}/bimetal"
          if command -v sha256sum >/dev/null; then
            grep "  ${archive}\$" SHA256SUMS | sha256sum -c -
          else
            grep "  ${archive}\$" SHA256SUMS | shasum -a 256 -c -
          fi
          if [ "${EXT}" = "zip" ]; then
            7z x -y "${archive}" >/dev/null
          else
            tar -xzf "${archive}"
          fi
          echo "${RUNNER_TEMP}/bimetal/bimetal-${BIMETAL_VERSION}-${TARGET}" >> "${GITHUB_PATH}"
      - name: Build native extension
        run: bimetal build --locked --config rust/sa17-py
      - name: Run Python test suite
        run: |
          uv --directory python sync --locked --group dev
          uv --directory python run pytest -v
      - name: Build cp311-abi3 wheel
        run: uv --directory python build --wheel
      - name: Repair Linux wheel for manylinux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf
          uvx auditwheel repair --wheel-dir python/dist-repaired python/dist/*.whl
          rm -rf python/dist
          mv python/dist-repaired python/dist
      - name: Smoke-test built wheel
        run: |
          wheel="$(ls python/dist/*.whl)"
          uv run --no-project --with "${wheel}" python -c 'import sa17; print(sa17.Database, sa17.Table)'
      - name: Check wheel metadata renders on PyPI
        run: uvx twine check --strict python/dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  # The registries publish in separate jobs, so when one fails it can run again
  # without publishing to the other a second time.
  crates:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The crates.io token is a secret of this environment, so no other job or
    # workflow can read it, and only a v* tag can enter the environment.
    environment:
      name: release
      url: https://crates.io/crates/sa17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - name: Publish Rust crate to crates.io
        run: cargo publish --locked -p sa17
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://pypi.org/project/sa17/
    # PyPI trusts this workflow and environment, so there is no PyPI token:
    # https://docs.pypi.org/trusted-publishers/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - name: Publish Python wheels to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  github:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [crates, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - name: Write wheel checksums
        working-directory: dist
        run: sha256sum *.whl > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Install

          Rust:

          \`\`\`toml
          [dependencies]
          sa17 = "${version}"
          \`\`\`

          Python:

          \`\`\`bash
          pip install sa17==${version}
          \`\`\`

          Packages: [sa17 on crates.io](https://crates.io/crates/sa17/${version}) and [sa17 on PyPI](https://pypi.org/project/sa17/${version}/).
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes
